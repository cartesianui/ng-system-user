<page-actions
  *ngIf="activeTab === 'General'"
  (update)="onUpdate()"
  [disabled]="{
    update: (formGroup.invalid && formGroupCredentails.invalid) || !(formGroup.dirty || formGroupCredentails.dirty)
  }"
/>
<page-actions
  *ngIf="activeTab === 'Roles'"
  (attach)="onAttach()"
  (revoke)="onRevoke()"
  [disabled]="{
    attach: !rolesToAttachControl.value || rolesToAttachControl.value.length < 1,
    revoke: rolesToRevoke?.length < 1
  }"
/>
<page-actions
  *ngIf="activeTab === 'Permissions'"
  (attach)="onAttachPermissions()"
  (revoke)="onRevokePermissions()"
  [disabled]="{
    attach: permissionsToAttach.length < 1,
    revoke: permissionsToRevoke.length < 1
  }"
/>

<!-- QA Q6-B28/B29 — see the create form: without `#formContainer` the busy
     overlay falls back to global and blocks the whole page. -->
<div class="main-content" #formContainer>
  <tabset>
    <tab heading="General" (selectTab)="onSelectTab($event)">
      <div class="row">
        <div class="col-md-6">
          <div class="card">
            <div class="card-header"><strong>Profile</strong></div>
            <div class="card-body">
              <!-- Avatar -->
              <div class="text-center mb-3">
                <image-picker
                  entityType="users"
                  [entityId]="user()?.id"
                  mode="avatar"
                  [editable]="true"
                  [removable]="true"
                  displayVariant="thumb"
                ></image-picker>
              </div>

              <form autocomplete="off" [formGroup]="formGroup">
                <div class="form-group required">
                  <with-validation>
                    <label class="form-label">Name</label>
                    <input validate type="text" formControlName="name" class="form-control" placeholder="Name" required />
                  </with-validation>
                </div>
                <div class="form-group required mt-2">
                  <with-validation>
                    <label class="form-label">Gender</label>
                    <select-control validate required formControlName="gender" inCollection="['male', 'female']" [options]="[{value:'male',name:'Male'},{value:'female',name:'Female'}]" optionKey="value" optionField="name" placeholder="Gender"></select-control>
                  </with-validation>
                </div>
                <div class="form-group required mt-2">
                  <with-validation>
                    <label class="form-label">Birth Date</label>
                    <input validate bsDatepicker type="text" formControlName="birth" class="form-control" placeholder="Birth Date" required age="18" />
                  </with-validation>
                </div>
                <div class="form-group mt-2">
                  <with-validation>
                    <label class="form-label">National ID</label>
                    <input validate type="text" formControlName="nationalId" class="form-control" placeholder="National ID" maxlength="50" />
                  </with-validation>
                </div>
              </form>
            </div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="card">
            <div class="card-header"><strong>Security</strong></div>
            <div class="card-body">
              <!-- Login identity: read-only here; it is set on create or by the invite below. -->
              <div class="form-group">
                <label class="form-label" for="edit-user-username">Username</label>
                <input id="edit-user-username" type="text" class="form-control" [value]="user()?.username || ''" placeholder="No login yet" readonly />
              </div>
              @if (user()?.email && canLogIn) {
                <div class="mt-2 mb-3">
                  <button type="button" class="btn btn-outline-primary btn-sm" [disabled]="inviting()" (click)="onInvite()">
                    <i class="fa-solid fa-envelope me-1"></i>Invite / resend set-password link
                  </button>
                  <small class="form-text text-muted d-block">Emails {{ user()?.email }} a link to set a password. Any earlier link stops working.</small>
                </div>
              }
              <form autocomplete="off" [formGroup]="formGroupCredentails">
                <div class="form-group">
                  <with-validation>
                    <label class="form-label">Current Password</label>
                    <input validate formControlName="currentPassword" type="password" class="form-control" placeholder="Current Password" requireRelativeTo="newPassword" />
                  </with-validation>
                </div>
                <div class="form-group mt-2">
                  <with-validation>
                    <label class="form-label">New Password</label>
                    <input validate formControlName="newPassword" type="password" class="form-control" placeholder="Minimum 8 characters" requireRelativeTo="currentPassword" minlength="8" />
                  </with-validation>
                </div>
                <div class="form-group mt-2">
                  <with-validation>
                    <label class="form-label">Confirm Password</label>
                    <input validate formControlName="confirmPassword" type="password" class="form-control" placeholder="Re-enter new password" equalTo="newPassword" />
                  </with-validation>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </tab>
    <tab heading="Roles" (selectTab)="onSelectTab($event)">
      <div class="row">
        <div class="col-md-5">
          <roles-lookup [formControl]="rolesToAttachControl" [ignoreOptions]="user()?.roles" />
        </div>
        <div class="col-md-7">
          <div class="card mt-2">
            <div class="card-header">
              <strong>Current Roles</strong>
              <small class="float-end text-muted">{{ user()?.roles?.length ?? 0 }} assigned</small>
            </div>
            <div class="card-body">
              <roles-list [rows]="user()?.roles" [(selected)]="rolesToRevoke" />
            </div>
          </div>
        </div>
      </div>
    </tab>
    <tab heading="Permissions" (selectTab)="onSelectTab($event)">
      <div class="row">
        <div class="col-md-5">
          <permissions-lookup [(selected)]="permissionsToAttach" [ignoreOptions]="user()?.permissions" />
        </div>
        <div class="col-md-7">
          <div class="card mt-2">
            <div class="card-header">
              <strong>Current Permissions</strong>
              <small class="float-end text-muted">{{ user()?.permissions?.length ?? 0 }} assigned</small>
            </div>
            <div class="card-body">
              <permissions-list [rows]="user()?.permissions" [(selected)]="permissionsToRevoke" />
            </div>
          </div>
        </div>
      </div>
    </tab>
  </tabset>
</div>
